name: Scheduled Security Scan

# §4.9 currency: re-scan on a schedule so dormant branches are re-checked
# against newly published advisories, not only when code changes. Also
# runnable on demand.
on:
  schedule:
    - cron: "27 6 * * 1" # Mondays 06:27 UTC (off-peak minute)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit pinned dependencies
        working-directory: backend
        run: |
          # Auditor installed hash-pinned so the scan job itself is locked (§4.9).
          pip install --require-hashes -r requirements-audit.lock
          pip-audit --require-hashes -r requirements.lock

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  osv-scanner:
    name: osv-scanner (whole tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan lockfiles against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
